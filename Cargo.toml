[workspace]
members = [
    "netlink-packet-audit",
    "netlink-packet-core",
    "netlink-packet-route",
    "netlink-proto",
    "netlink-sys",
    "rtnetlink",
]
resolver = "2"

[workspace.package]
authors = ["Corentin Henry <corentinhenry@gmail.com>"]
license = "MIT"
readme = "README.md"

[workspace.dependencies]
async-global-executor = "3.1.0"
async-io = "2.6.0"
async-std = "1.13.2"
bitflags = "2"
env_logger = "0.11.11"
futures-channel = "0.3.34"
futures-util = "0.3.34"
ipnetwork = "0.21.1"
libc = "0.2.191"
log = "0.4.35"
macaddr = "1.0.1"
mio = "1.2.5"
netlink-packet-audit = { path = "netlink-packet-audit" }
netlink-packet-core = { path = "netlink-packet-core" }
netlink-packet-route = { path = "netlink-packet-route" }
netlink-proto = { path = "netlink-proto" }
netlink-sys = { path = "netlink-sys" }
nix = "0.32.0"
pretty_assertions = "1.4.1"
tokio = "1.54.1"
zerocopy = "0.8"
