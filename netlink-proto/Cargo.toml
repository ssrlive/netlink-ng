[package]
name = "netlink-proto"
version.workspace = true
edition = "2024"
rust-version = "1.85"

keywords = ["netlink", "linux", "async"]
license.workspace = true
readme.workspace = true
repository = "https://github.com/rust-netlink/netlink-proto"
description = "async netlink protocol"

[dependencies]
log.workspace = true
futures-channel.workspace = true
futures-util = { workspace = true, features = ["sink"] }
netlink-packet-core.workspace = true
netlink-sys = { workspace = true, default-features = false }

[features]
default = ["tokio_socket"]
tokio_socket = ["netlink-sys/tokio_socket"]
smol_socket = ["netlink-sys/smol_socket"]

[dev-dependencies]
libc.workspace = true
tokio = { workspace = true, default-features = false, features = ["macros", "rt-multi-thread", "time"] }

[[example]]
name = "dump_links_async"
required-features = ["tokio_socket"]
