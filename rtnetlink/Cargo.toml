[package]
name = "rtnetlink"
version.workspace = true
edition = "2024"
keywords = ["netlink", "ip", "linux"]
license.workspace = true
readme.workspace = true
repository = "https://github.com/rust-netlink/rtnetlink"
description = "manipulate linux networking resources via netlink"
rust-version = "1.85"

[features]
test_as_root = []
default = ["tokio_socket"]
tokio_socket = ["netlink-proto/tokio_socket", "tokio"]
smol_socket = ["netlink-proto/smol_socket", "async-global-executor"]

[dependencies]
futures-util.workspace = true
futures-channel.workspace = true
log.workspace = true
netlink-packet-route.workspace = true
netlink-packet-core.workspace = true
netlink-proto = { workspace = true, default-features = false }
tokio = { workspace = true, features = ["rt"], optional = true }

[dev-dependencies]
env_logger.workspace = true
ipnetwork.workspace = true
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread"] }
async-std = { workspace = true, features = ["attributes"] }
macaddr.workspace = true

[target.'cfg(any(target_os = "linux", target_os = "android"))'.dependencies]
nix = { workspace = true, default-features = false, features = [
    "fs",
    "mount",
    "sched",
    "signal",
] }
async-global-executor = { workspace = true, optional = true }
