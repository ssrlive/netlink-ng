[package]
name = "rtnetlink"
version = "0.24.0"
authors = ["Corentin Henry <corentinhenry@gmail.com>"]
edition = "2024"
keywords = ["netlink", "ip", "linux"]
license = "MIT"
readme = "README.md"
repository = "https://github.com/rust-netlink/rtnetlink"
description = "manipulate linux networking resources via netlink"
rust-version = "1.85"

[features]
test_as_root = []
default = ["tokio_socket"]
tokio_socket = ["netlink-proto/tokio_socket", "tokio"]
smol_socket = ["netlink-proto/smol_socket", "async-global-executor"]

[dependencies]
futures-util = "0.3.34"
futures-channel = "0.3.34"
log = "0.4.35"
netlink-packet-route = { path = "../netlink-packet-route" }
netlink-packet-core = { path = "../netlink-packet-core" }
netlink-proto = { path = "../netlink-proto", default-features = false }
tokio = { version = "1.54.1", features = ["rt"], optional = true }

[dev-dependencies]
env_logger = "0.11.11"
ipnetwork = "0.21.1"
tokio = { version = "1.54.1", features = ["macros", "rt", "rt-multi-thread"] }
async-std = { version = "1.13.2", features = ["attributes"] }
macaddr = "1.0.1"

[target.'cfg(any(target_os = "linux", target_os = "android"))'.dependencies]
nix = { version = "0.32.0", default-features = false, features = [
    "fs",
    "mount",
    "sched",
    "signal",
] }
async-global-executor = { version = "3.1.0", optional = true }
