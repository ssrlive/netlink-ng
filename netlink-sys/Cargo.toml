[package]
name = "netlink-sys"
version = "1.0.0-rc2"
edition = "2024"
rust-version = "1.85"
keywords = ["netlink", "ip", "linux"]
license.workspace = true
readme.workspace = true
repository = "https://github.com/rust-netlink/netlink-sys"
description = "netlink sockets, with optional integration with tokio"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--generate-link-to-definition"]

[dependencies]
libc.workspace = true
log = { workspace = true, optional = true }

tokio = { workspace = true, optional = true, default-features = false, features = ["net", "rt"] }
mio = { workspace = true, optional = true, features = ["os-poll", "os-ext"] }
async-io = { workspace = true, optional = true }

# We only depend on tokio for AsyncFd. The `rt` feature is required to check
# that a runtime is available before registering the socket.
[dev-dependencies]
netlink-packet-audit.workspace = true
netlink-packet-core.workspace = true
tokio = { workspace = true, default-features = false, features = ["net", "macros", "rt-multi-thread"] }
async-std = { workspace = true, features = ["attributes"] }

[features]
default = []
mio_socket = ["mio"]
tokio_socket = ["tokio", "dep:log"]
smol_socket = ["async-io", "dep:log"]

[[example]]
name = "audit_events"

[[example]]
name = "audit_events_tokio"
required-features = ["tokio_socket"]

[[example]]
name = "audit_events_tokio_manual_thread_builder"
required-features = ["tokio_socket"]

[[example]]
name = "audit_events_smol"
required-features = ["smol_socket"]
